[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22 for native WebSocket — newer @supabase/supabase-js (realtime-js)
  # throws at createClient on Node 18 ("no native WebSocket support"), which
  # 500s the whole site. Node 22 satisfies Astro 4's engines (>=21).
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[images]
remote_images = ["https://.*"]

# The Netlify adapter handles routing automatically
# No need for manual redirects when using SSR